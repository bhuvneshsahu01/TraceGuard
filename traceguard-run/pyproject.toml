[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceguard-run"
version = "0.1.0"
description = "TraceGuard CLI and Mathematical Evaluation Engine"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Bhuvnesh", email = "bhuvnesh@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics"
]
keywords = ["llm", "evaluation", "metrics", "drift", "psi"]

[project.urls]
Homepage = "https://github.com/bhuvneshsahu01/TraceGuard"
Repository = "https://github.com/bhuvneshsahu01/TraceGuard.git"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "traceguard"
]

[project.scripts]
traceguard = "traceguard_run.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traceguard_run"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
target-version = "py39"
