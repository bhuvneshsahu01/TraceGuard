[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceguard-ai-fuzz"
version = "0.1.0"
description = "TraceGuard Adversarial Fuzzer Module"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Bhuvnesh", email = "bhuvnesh@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security"
]
keywords = ["llm", "security", "fuzzing", "redteam"]

dependencies = [
    "traceguard-ai"
]

[project.urls]
Homepage = "https://github.com/bhuvneshsahu01/TraceGuard"
Repository = "https://github.com/bhuvneshsahu01/TraceGuard.git"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traceguard_fuzz"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
target-version = "py39"
