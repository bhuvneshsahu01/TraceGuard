name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: SDK Tests & Static Analysis (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-asyncio pytest-cov hypothesis scipy scikit-learn numpy fastapi starlette httpx opentelemetry-api opentelemetry-sdk groq ruff mypy
          pip install -e traceguard-sdk

      - name: Ruff Linter
        run: |
          ruff check --config ruff.toml traceguard-sdk tests

      - name: MyPy Static Type Check
        run: |
          mypy traceguard-sdk/src --ignore-missing-imports

      - name: Run Pytest Regression Suite
        run: |
          pytest tests/ -v --cov=traceguard --cov-report=xml --cov-report=term-missing

      - name: Run Latency & Memory Benchmarks
        run: |
          python benchmarks/bench_otel_overhead.py
          python benchmarks/run_benchmarks.py

  dashboard-build:
    name: Next.js Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: traceguard-dashboard/package.json

      - name: Install dependencies
        working-directory: traceguard-dashboard
        run: npm install --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: traceguard-dashboard
        run: npx prisma generate

      - name: Build Next.js Dashboard
        working-directory: traceguard-dashboard
        run: npm run build
