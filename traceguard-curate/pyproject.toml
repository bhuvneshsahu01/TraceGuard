[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceguard-ai-curate"
version = "0.2.0"
description = "TraceGuard Dataset Curation Pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Bhuvnesh", email = "bhuvnesh.sahu@outlook.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["llm", "dataset", "curation", "finetuning"]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/bhuvneshsahu01/TraceGuard"
Repository = "https://github.com/bhuvneshsahu01/TraceGuard.git"

[project.scripts]
traceguard-curate = "traceguard_curate.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traceguard_curate"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
target-version = "py39"
