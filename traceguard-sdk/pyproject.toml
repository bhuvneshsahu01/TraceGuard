[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceguard"
version = "0.1.0"
description = "The Unified Agent CI & Eval Platform SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Bhuvnesh", email = "bhuvnesh@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "groq>=0.9.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traceguard"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
target-version = "py39"
