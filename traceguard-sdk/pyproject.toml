[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceguard"
version = "0.1.0"
description = "The Unified Agent CI & Eval Platform SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Bhuvnesh", email = "bhuvnesh@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
keywords = ["llm", "observability", "evaluation", "agents", "opentelemetry"]

dependencies = [
    "pydantic>=2.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "groq>=0.9.0",
    "litellm>=1.0.0",
    "typing-extensions>=4.5.0",
    "langchain-core>=0.1.0",
    "psycopg2-binary>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/bhuvneshsahu01/TraceGuard"
Repository = "https://github.com/bhuvneshsahu01/TraceGuard.git"
Documentation = "https://github.com/bhuvneshsahu01/TraceGuard/wiki"
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/traceguard"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
target-version = "py39"
