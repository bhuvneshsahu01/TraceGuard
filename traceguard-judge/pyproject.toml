[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceguard-judge"
version = "0.2.0"
description = "LLM-as-a-Judge Evaluation Engine for TraceGuard"
authors = [
    {name = "TraceGuard Team", email = "team@traceguard.ai"}
]
dependencies = [
    "groq>=0.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
traceguard-judge = "traceguard_judge.cli:main"
